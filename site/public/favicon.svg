<svg xmlns="http://www.w3.org/2000/svg" width="824" height="824" viewBox="100 100 824 824">
  <!-- Skillbook: open book with a spark (see assets/icon.svg). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3c"/><stop offset="1" stop-color="#141415"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6d6db"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e8e93"/><stop offset="1" stop-color="#636366"/></linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.1"/>

  <g transform="translate(0 32)">
  <!-- page block under the open pages -->
  <path d="M512 742 C 444 700, 346 690, 238 702 L 238 420 L 262 418 L 262 676 C 352 664, 440 676, 512 718 C 584 676, 672 664, 762 676 L 762 418 L 786 420 L 786 702 C 678 690, 580 700, 512 742 Z" fill="url(#edge)"/>
  <!-- pages -->
  <path d="M500 438 C 442 392, 352 378, 262 392 L 262 676 C 352 664, 442 676, 500 718 Z" fill="url(#gl)"/>
  <path d="M524 438 C 582 392, 672 378, 762 392 L 762 676 C 672 664, 582 676, 524 718 Z" fill="url(#gl)"/>
  <!-- lines of text -->
  <g fill="none" stroke="#1c1c1e" stroke-opacity=".16" stroke-width="16" stroke-linecap="round">
    <path d="M310 466 C 370 460, 420 468, 456 486"/>
    <path d="M310 530 C 370 524, 420 532, 456 550"/>
    <path d="M310 594 C 350 590, 380 594, 404 602"/>
    <path d="M714 466 C 654 460, 604 468, 568 486"/>
    <path d="M714 530 C 654 524, 604 532, 568 550"/>
    <path d="M714 594 C 674 590, 644 594, 620 602"/>
  </g>
  <!-- spark -->
  <path d="M512 196 Q 519 262 584 270 Q 519 278 512 344 Q 505 278 440 270 Q 505 262 512 196 Z" fill="url(#gl)"/>
  <path d="M628 214 Q 631 238 654 241 Q 631 244 628 268 Q 625 244 602 241 Q 625 238 628 214 Z" fill="#fff" fill-opacity=".7"/>
  </g>
</svg>
